<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Set your password | Secure Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo" aria-hidden="true">🔐</div>
            <h1>Set your password</h1>
            <p class="subtitle">Choose a strong password for your administrator account.</p>
            <form id="passwordSetupForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
                </div>
                <button id="passwordSetupButton" type="submit" class="login-button">Set password</button>
                <p id="passwordSetupMessage" class="message" role="status" aria-live="polite"></p>
            </form>
            <div class="security-notice">
                <span aria-hidden="true">🔒</span>
                <p>The email link is single-use and expires after one hour. You will set up your authenticator when you first sign in.</p>
            </div>
        </section>
    </main>
    <script src="password-setup.js"></script>
</body>
</html>
