<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Secure Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo" aria-hidden="true">🔐</div>
            <h1>Reset password</h1>
            <p class="subtitle">Request a reset code, then choose a new password.</p>

            <form id="resetRequestForm">
                <div class="form-group">
                    <label for="resetEmail">Email address</label>
                    <input id="resetEmail" name="email" type="email" autocomplete="username" placeholder="Enter your email" required>
                </div>
                <button id="requestResetButton" type="submit" class="login-button">Get reset code</button>
                <p id="resetRequestMessage" class="message" role="status" aria-live="polite"></p>
            </form>

            <form id="resetConfirmForm" hidden>
                <div class="form-group">
                    <label for="resetCode">Reset code</label>
                    <input id="resetCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" placeholder="000000" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
                </div>
                <button id="confirmResetButton" type="submit" class="login-button">Change password</button>
                <p id="resetConfirmMessage" class="message" role="status" aria-live="polite"></p>
            </form>

            <p class="back-link"><a href="/">Back to sign in</a></p>
        </section>
    </main>
    <script src="/forgot-password.js?v=password-reset-1"></script>
</body>
</html>
